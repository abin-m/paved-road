<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" xml:space="preserve" role="img" aria-label="Real guard output for three blocked calls and one allowed call"><title>Real guard output for three blocked calls and one allowed call</title><style>
  .win{fill:#0B0F14;stroke:#1F252E}.bar{fill:#11161D}.dot{fill:#2A313B}.sep{stroke:#1F252E}
  .hd{fill:#6B7480;font:500 12px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .call{fill:#E6EAF0;font:600 12.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.msg{fill:#98A2B3;font:12px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sb{fill:#3A1519}.sbt{fill:#FF8A80;font:700 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
  .sa{fill:#0F2A1E}.sat{fill:#4ADE80;font:700 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
</style><rect class="win" x=".5" y=".5" width="879" height="359" rx="12"/><path class="bar" d="M1 13a12 12 0 0 1 12-12H867a12 12 0 0 1 12 12V40H1z"/><path class="sep" d="M1 40H879"/><circle class="dot" cx="20" cy="20.0" r="5.5"/><circle class="dot" cx="38" cy="20.0" r="5.5"/><circle class="dot" cx="56" cy="20.0" r="5.5"/><text class="hd" x="440.0" y="24.0" text-anchor="middle">guard output</text><rect class="sb" x="28" y="60" width="72" height="20" rx="5"/><text class="sbt" x="64" y="74" text-anchor="middle">BLOCKED</text><text class="call" x="120" y="74">Read .env</text><text class="msg" x="120" y="94">(secret file (.env)): secrets are never read into context; reference the value at runtime or</text><text class="msg" x="120" y="114">write a script for the human to run.</text><rect class="sb" x="28" y="134" width="72" height="20" rx="5"/><text class="sbt" x="64" y="148" text-anchor="middle">BLOCKED</text><text class="call" x="120" y="148">Bash  git add -A</text><text class="msg" x="120" y="168">(bulk staging): `git add -A` / `git add .` sweeps unrelated work into the commit. Stage explicit</text><text class="msg" x="120" y="188">paths: git add &lt;file&gt; ...</text><rect class="sb" x="28" y="208" width="72" height="20" rx="5"/><text class="sbt" x="64" y="222" text-anchor="middle">BLOCKED</text><text class="call" x="120" y="222">Bash  kubectl -n prod delete pod api-1</text><text class="msg" x="120" y="242">(kubectl against production/staging): this mutates a live environment and was not explicitly</text><text class="msg" x="120" y="262">asked for. If it IS intended, say so and re-run prefixed with PROD_OK=1 so the authorisation is</text><text class="msg" x="120" y="282">on the record.</text><rect class="sa" x="28" y="302" width="72" height="20" rx="5"/><text class="sat" x="64" y="316" text-anchor="middle">ALLOWED</text><text class="call" x="120" y="316">Bash  PROD_OK=1 kubectl -n prod rollout undo deployment/api</text><text class="msg" x="120" y="336">secrets-guard, main-guard and prod-guard all exit 0.</text></svg>
