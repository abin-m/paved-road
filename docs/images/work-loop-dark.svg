<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="The work loop, from issue to merged pull request"><title>The work loop, from issue to merged pull request</title><style>
  .card{fill:#FFFFFF;stroke:#E4E7EC}
