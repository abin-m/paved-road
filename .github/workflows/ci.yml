# CI — the gate. Everything here also runs locally via:
#   python3 tools/lint.py && python3 paved-road-core/tests/guards.test.py
#
# The matrix is the point: the guards ship to whatever machine installs the
# plugin, so they are proven on macOS, Linux and Windows, and on the oldest
# Python the README promises (3.9) as well as current.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # least privilege; the release workflow widens it for itself

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      # Pin by SHA for a stricter posture (see secure-defaults):
      #   gh api repos/actions/checkout/git/ref/tags/v5 --jq .object.sha
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Lint pack (manifests, frontmatter, hook wiring, python floor)
        run: python tools/lint.py

      - name: Guard tests
        run: python paved-road-core/tests/guards.test.py

      - name: Guard benchmark (report only)
        if: runner.os != 'Linux'
        run: python tools/bench.py --runs 10

      # bench/results.json is what the README quotes, so it must match the
      # guards. Checked on one OS: the counts are the same on each.
      - name: Guard benchmark (results file is current)
        if: runner.os == 'Linux'
        run: python tools/bench.py --runs 10 --check bench/results.json

      - name: Harbor tasks score as expected (no Docker, no model)
        if: runner.os == 'Linux'
        run: |
          python bench/harbor/sync.py --check
          python bench/harbor/selftest.py

      - name: Tool tests (no network, no token)
        run: python paved-road-core/tests/tools.test.py

      - name: Prose check (writing skill faults)
        run: python paved-road-core/bin/prose-check .

  hook-invocation:
    # hooks.json invokes the guards as `python3 <path>`. If that interpreter
    # name is not resolvable, every guard silently fails open — so assert the
    # exact command line the harness will run, on each POSIX platform.
    name: hook command line (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: python3 resolves and the guard blocks a secret read
        run: |
          set -euo pipefail
          echo '{"tool_name":"Read","tool_input":{"file_path":".env"}}' \
            | python3 "paved-road-core/hooks/secrets-guard.py" && rc=0 || rc=$?
          test "$rc" -eq 2 || { echo "expected exit 2, got $rc"; exit 1; }
          echo "guard blocked as expected (exit 2)"
      - name: python3 resolves and the Bash hook blocks bulk staging
        run: |
          set -euo pipefail
          echo '{"tool_name":"Bash","tool_input":{"command":"git add -A"}}' \
            | python3 "paved-road-core/hooks/bash-guards.py" && rc=0 || rc=$?
          test "$rc" -eq 2 || { echo "expected exit 2, got $rc"; exit 1; }
          echo "Bash hook blocked as expected (exit 2)"
      - name: python3 resolves and the session hook prints the working style
        run: |
          set -euo pipefail
          echo '{"hook_event_name":"SessionStart"}' \
            | python3 "paved-road-core/hooks/working-style.py" | grep -q '^# Working style'
          echo "working style printed"
