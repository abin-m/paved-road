name: Feature request
description: Propose a new skill, hook, script or change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest. Say whether it is a skill, hook, script or agent.
    validations:
      required: true
